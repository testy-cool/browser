version: '3.8'

services:
  lightpanda:
    build: .
    container_name: lightpanda-server
    ports:
      - "${LIGHTPANDA_PORT:-9222}:9222"
    environment:
      - TZ=${TZ:-UTC}
    command: >
      /bin/lightpanda serve
      --host 0.0.0.0
      --port 9222
      ${HTTP_PROXY:+--http-proxy ${HTTP_PROXY}}
      ${PROXY_BEARER_TOKEN:+--proxy-bearer-token ${PROXY_BEARER_TOKEN}}
      ${USER_AGENT_SUFFIX:+--user-agent-suffix "${USER_AGENT_SUFFIX}"}
      ${TLS_VERIFY_HOST:+--tls-verify-host ${TLS_VERIFY_HOST}}
      ${HTTP_TIMEOUT:+--http-timeout ${HTTP_TIMEOUT}}
      ${HTTP_MAX_CONCURRENT:+--http-max-concurrent ${HTTP_MAX_CONCURRENT}}
      ${LOG_LEVEL:+--log-level ${LOG_LEVEL}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lightpanda-net
    # Optional: limit resources
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

networks:
  lightpanda-net:
    driver: bridge
